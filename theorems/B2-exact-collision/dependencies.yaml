  - id: B2-RANK-CONJECTURE
    statement: >
      For Li-type or moment-type test families Phi with m tests and on-line heights
      t_1 < ... < t_m (rational, distinct, positive), the m x m Jacobian J has
      det(J) != 0 over Q.  For Li-type: J_{jk} = 2(1 - cos(j*theta_k)) where
      theta_k = 2*arctan(2*t_k) - pi; full rank proved by Vandermonde reduction
      (proof.md §4.3): factor 1-T_j(x) = (1-x)Q_j(x), express [Q_j(x_k)] = U*V,
      conclude det != 0 from Vandermonde and positive leading coefficients.
      For moment-type: analogous cosine-Vandermonde argument (proof.md §4.4).
    source: "proof.md §4.3-§4.4 (self-contained Vandermonde reduction); OB-20 Gate-A review"
    mathematical: INDEPENDENTLY-CHECKED
    computational: INDEPENDENT-CHECKER
    usable_as_premise: true
    role: >
      Central rank step for B2 construction. Proved by self-contained Vandermonde
      reduction in proof.md §4.3 — no external citation required. OB-20 Gate-A review
      independently re-derived and confirmed det C != 0 (closed form
      4^m 2^{m(m-1)/2} prod(1-x_k) prod(x_l-x_k)) for m up to 6 in exact rational
      arithmetic (noting a sympy.nsimplify false-negative at m=5, excluded by pure
      Fraction det). Finite core also INDEPENDENT-CHECKER via OB-13.
    gate_a_status: CLOSED
    caveat: >
      Gate A CLOSED by OB-20 (2026-08-11): whole-theorem independent review passed.
      A sympy.nsimplify false-"det=0" at m=5 was found and excluded during review —
      recorded as a verification-tool caveat (do not trust a simplifier's zero result;
      use exact Fraction determinant).
      Proof is self-contained (Vandermonde + Chebyshev identity cos(jt)=T_j(cost)
      + leading-coefficient computation from T_j recurrence). No Karlin-Studden
      citation needed. Integer-sign step RESOLVED (proof.md §4.5 — multiplicity
      buffer). Independent review complete (OB-20): status INDEPENDENTLY-CHECKED.

