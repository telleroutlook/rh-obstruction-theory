# Dependencies — Theorem C (C-euler-tail)

theorem_id: C-euler-tail
status: PROOF-DRAFT (Gate A CLEARED — all dependencies verified)

dependencies:

  - id: ANDERSSON-HELSON-PRESCRIBED-ZERO
    statement: >
      (Andersson Theorem 5, arXiv:2408.15713) Let U be an open connected set containing
      {Re(s)>1}, and let Z be any signed multiset in U ∩ {Re(s)<1} without limit points
      on U ∪ (1+iR). Then there exists a completely multiplicative unimodular chi such
      that the Helson zeta-function zeta_chi(s) has meromorphic continuation to U with
      prescribed poles and zeros from Z, and U is its maximal domain of meromorphicity.
    source: "Andersson, arXiv:2408.15713, Theorem 5 (label: thm5); LaTeX source verified in baseline/andersson-2408.15713/"
    mathematical: INDEPENDENTLY-CHECKED
    computational: NONE
    usable_as_premise: true
    gate_a_status: CLEARED
    role: >
      Load-bearing: prescribes one zero z_1 in 0 < Re(z_1) < 1, Re(z_1) != 1/2.
      Theorem C uses this with U = C (or any domain containing Re(s)>1),
      Z = {z_1} (single prescribed zero off the critical line).

  - id: HELSON-CLASS-DEFINITION
    statement: >
      A Helson zeta function is an L-function with completely multiplicative
      chi with |chi(p)| = 1, Euler product, and meromorphic continuation.
    source: "Helson 1954; Bayart 2002; Andersson 2408.15713 §1"
    mathematical: DEFINITION
    computational: NONE
    usable_as_premise: true
    role: "Ambient class definition."

  - id: DAVENPORT-HEILBRONN-COMPARISON
    statement: >
      The Davenport-Heilbronn function satisfies a Riemann-type functional
      equation but has zeros off the critical line (Re(s) = 1/2).
    source: "Davenport-Heilbronn 1936; see also Titchmarsh 'Theory of the Riemann Zeta Function' §9.19"
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: >
      Comparison example showing functional equation alone does not force
      critical-line zeros. Kept SEPARATE from Theorem C (program §8.C.2):
      Davenport-Heilbronn lacks Euler product; C-euler-tail lacks functional
      equation. The two obstructions are not combined.

  - id: DIRICHLET-POLYNOMIAL-ZERO-FREE
    statement: >
      The finite factor R(s; P_0, chi) = product_{p <= P_0} (1 - chi(p) p^{-s})
      / (1 - p^{-s}) is holomorphic and nowhere zero in the open strip
      {0 < Re(s) < 1}.
    source: "proof.md §3 — elementary: zeros and poles of R lie on Re(s) = 0"
    mathematical: PROOF-DRAFT
    computational: NONE
    usable_as_premise: true
    role: "Key step ensuring zero preservation under finite-factor modification."

