# Dependencies — Theorem D' (D-prime-logpoly)

theorem_id: D-prime-logpoly
status: ESCAPE-ROUTE-REFINED (OB-01 + OB-16, 2026-08-11 — 𝒞_logpoly is NOT the escape class)

dependencies:

  - id: LOG-POLYHOMOGENEOUS-HEAT-KERNEL
    statement: >
      For P a positive classical elliptic PsiDO of order m > 0 on a compact d-manifold,
      and A in CL^{a,k} log-polyhomogeneous of finite log-degree k, the weighted heat
      trace Tr(A e^{-tP}) ~ sum_{j>=0} t^{(j-d-a)/m} c_j(log t) + sum_{r>=0} d_r t^r,
      with deg c_j <= k if (j-d-a)/m is not a non-negative integer, else <= k+1.
      With A = I (a=0, k=0) and j=0, the exponent -d/m is negative (not a non-negative
      integer), so c_0 is a CONSTANT: the LEADING term t^{-d/m} carries NO log.
    source: >
      Lesch, M. (1999) "On the noncommutative residue for pseudodifferential operators
      with log-polyhomogeneous symbols" Ann. Global Anal. Geom. 17:151-187, Theorem 3.7,
      eqs (3.18)-(3.22). Extends Grubb, G. and Seeley, R.T. (1995) Invent. Math.
      121(3):481-529, Theorem 2.7.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    gate_a_note: >
      Theorem numbers pinned by OB-15 external review (2026-08-11): Lesch 1999 Thm 3.7 +
      (3.18)-(3.22), Grubb-Seeley 1995 Thm 2.7. Physical-copy verification still tracked
      as open, but the exact numbers and scope are now confirmed by the referee.
    role: >
      Establishes that finite-log-degree C_logpoly has a PURE-POWER leading heat-trace
      singularity; logs appear only at subleading orders t^k log t (k>=1, from Wres(H^k)).
      CORRECTION (OB-01/OB-16): this REFUTES the earlier claim that c_{0,1}=(2pi)^{-1}
      could be achieved as a LEADING term in C_logpoly. C_logpoly is NOT the escape class.

  - id: LEADING-SINGULARITY-COVERS-SUBPRINCIPAL-LOGPOLY
    statement: >
      For H in the NARROWED class C_logpoly^{sub,ell} (scalar, self-adjoint closure in
      L^2(M,dmu), closed d-manifold, H>=-C, compact resolvent, uniformly positive classical
      elliptic principal symbol h_m >= c|xi|^m, finite log terms only at strictly LOWER order
      j>=1 with standard S^{m-J+eps}_{1,0} remainder estimates), the Weyl principal term is
      fixed by h_m alone via a classical comparison / min-max argument (Hormander 1968 Thm 4.4
      + p.215 reduction), so N_H(Lambda) ~ C_H Lambda^{d/m}; shifted Karamata (BGT Thm 1.7.1)
      then gives Z_H(t) ~ Gamma(d/m+1) C_H t^{-d/m} -- a pure power, no leading log.
      Comparison with Z_zeta(t) ~ (1/2pi) t^{-1} log(1/t) (Titchmarsh-Heath-Brown Thm 9.4 +
      BGT) excludes spec(H) = {gamma_n} as multisets for any H in this class.
    source: >
      OB-33 external review 2026-08-13 (GATE-A CONDITIONAL, M1-M9 integrated).
      Comparison proof: Hormander (1968) Acta Math. 121, Theorem 4.4 + p.215 classical
      complex-power reduction; Bingham-Goldie-Teugels (1987) Thm 1.7.1 (Karamata);
      Titchmarsh-Heath-Brown (1986) Thm 9.4 (RvM, unconditional).
    mathematical: INDEPENDENTLY-CHECKED
    computational: NONE
    usable_as_premise: true
    gate_a_status: INDEPENDENTLY-CHECKED
    gate_a_note: >
      OB-33 GATE-A CONDITIONAL, 2026-08-13. Referee confirmed: (1) sub-principal logs are
      o(|xi|^m) and do not enter Weyl term; (2) comparison/min-max proof correct;
      (3) shifted Karamata correct; (4) T^4 non-elliptic counterexample confirmed (pi^2
      coefficient); (5) no RH input. M1-M9 edits integrated into proof.md and statement.md.
      Claim: ellipticity is sufficient (not iff) for C_H finite.
    role: >
      NARROWED leading-singularity lemma (renamed from LEADING-SINGULARITY-COVERS-LOGPOLY
      after OB-31 BLOCKED its universal C_logpoly form). The full C_logpoly universal claim
      is FALSE (non-elliptic H=(I-Delta_x)(I-Delta_y) on T^4 has leading log). The narrowed
      C_logpoly^{sub,ell} lemma now INDEPENDENTLY-CHECKED (OB-33). The genuine escape class
      (leading t^{-1}log(1/t)) is the log-WEIGHTED S^{1,-1} (|xi|/log|xi|-type) class; the
      exact 2pi*n/log(n+e) model is REFUTED (count-N_zeta ~ T log log T).

  - id: SEELEY-DEWITT-EXPANSION
    statement: >
      The heat trace of H in C_ell (classical elliptic; differential or Laplace-type
      sub-cases) has a polyhomogeneous expansion with no LEADING log term.
    source: >
      For Laplace-type: Berline-Getzler-Vergne Thm 2.30. For differential operators:
      Gilkey Lemma 1.8.2 (NOT "Thm 1.8.1"). For general classical elliptic PsiDO the
      correct reference is Lesch 1999 Thm 3.7 (see LOG-POLYHOMOGENEOUS-HEAT-KERNEL);
      BGV/Gilkey do NOT cover the general PsiDO case (PROMPT_LINT L17).
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    role: >
      Comparison reference: C_ell (subset of C_logpoly with tau_k=0) has pure-power
      leading term. Scope corrected: BGV/Gilkey are differential/Laplace-type only.

  - id: FORM-BOUNDEDNESS-OF-Q
    statement: >
      For H in C_sub (positive, self-adjoint, classical elliptic principal symbol h_m,
      sub-principal terms in ∩ Ψ^{m-1+ε}_{1,0}(M) for every ε∈(0,1)) and P∈C_ell with
      the same principal symbol, Q := H - P ∈ ∩ Ψ^{m-1+ε}_{1,0}(M) has relative form
      bound 0 with respect to P: for every δ>0 there exists C_δ≥0 such that
      |q_Q[u]| ≤ δ q_P[u] + C_δ ‖u‖² for all u ∈ H^{m/2}(M).
    source: >
      OB-37-B external review 2026-08-14 (GATE-A CONDITIONAL, all 12 fixes M1–M12
      integrated). Key references: Taylor, Partial Differential Equations II (1996)
      §7; Reed–Simon Vol. 2 Theorem X.18 (KLMN theorem); Shubin (2001) §11.
      Symbol-class: Ψ^{m-1+ε}_{1,0}(M), Hörmander class (NOT classical Ψ_cl).
    mathematical: INDEPENDENTLY-CHECKED
    computational: NONE
    usable_as_premise: true
    gate_a_status: INDEPENDENTLY-CHECKED
    gate_a_note: >
      OB-37-B GATE-A CONDITIONAL, 2026-08-14. Referee confirmed: form bound 0 via
      Sobolev interpolation + Gårding, KLMN absorption, Calderón–Vaillancourt for m≤1-ε
      branch. Correct symbol class is Ψ^{m-1+ε}_{1,0} (Hörmander), not Ψ_cl.
      All 12 fixes (M1–M12) integrated into paper and outsource file.
    role: >
      Key analytic lemma for Theorem D' proof: establishes that sub-principal
      perturbations have form bound 0, allowing the Weyl law for H to coincide with
      the Weyl law for its principal-symbol reference operator P.

