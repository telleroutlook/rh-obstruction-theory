# Dependencies — Theorem D' (D-prime-logpoly)

theorem_id: D-prime-logpoly
status: ESCAPE-ROUTE-REFINED (OB-01 + OB-16, 2026-08-11 — 𝒞_logpoly is NOT the escape class)

dependencies:

  - id: LOG-POLYHOMOGENEOUS-HEAT-KERNEL
    statement: >
      For P a positive classical elliptic PsiDO of order m > 0 on a compact d-manifold,
      and A in CL^{a,k} log-polyhomogeneous of finite log-degree k, the weighted heat
      trace Tr(A e^{-tP}) ~ sum_{j>=0} t^{(j-d-a)/m} c_j(log t) + sum_{r>=0} d_r t^r,
      with deg c_j <= k if (j-d-a)/m is not a non-negative integer, else <= k+1.
      With A = I (a=0, k=0) and j=0, the exponent -d/m is negative (not a non-negative
      integer), so c_0 is a CONSTANT: the LEADING term t^{-d/m} carries NO log.
    source: >
      Lesch, M. (1999) "On the noncommutative residue for pseudodifferential operators
      with log-polyhomogeneous symbols" Ann. Global Anal. Geom. 17:151-187, Theorem 3.7,
      eqs (3.18)-(3.22). Extends Grubb, G. and Seeley, R.T. (1995) Invent. Math.
      121(3):481-529, Theorem 2.7.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    gate_a_note: >
      Theorem numbers pinned by OB-15 external review (2026-08-11): Lesch 1999 Thm 3.7 +
      (3.18)-(3.22), Grubb-Seeley 1995 Thm 2.7. Physical-copy verification still tracked
      as open, but the exact numbers and scope are now confirmed by the referee.
    role: >
      Establishes that finite-log-degree C_logpoly has a PURE-POWER leading heat-trace
      singularity; logs appear only at subleading orders t^k log t (k>=1, from Wres(H^k)).
      CORRECTION (OB-01/OB-16): this REFUTES the earlier claim that c_{0,1}=(2pi)^{-1}
      could be achieved as a LEADING term in C_logpoly. C_logpoly is NOT the escape class.

  - id: LEADING-SINGULARITY-COVERS-LOGPOLY
    statement: >
      The leading-singularity obstruction of Theorem D extends to C_logpoly: no
      finite-log-degree log-polyhomogeneous H has leading heat-trace singularity
      t^{-d/m} log(1/t). The genuine escape class is the log-WEIGHTED symbol class
      S^{1,-1} (|xi|/log|xi|-type), which gives N_H(T) ~ c T log T and a genuine leading
      t^{-1} log(1/t); it is outside C_ell and C_logpoly but inside Hormander S^1_{1,0}.
    source: "OB-16 external review 2026-08-11 (statement.md §4, proof.md §2)."
    mathematical: PROOF-DRAFT
    computational: NONE
    usable_as_premise: false
    gate_a_status: PENDING
    role: >
      Corrected escape-class identification. The naive exact model 2pi*n/log(n+e) is
      REFUTED (count differs from N_zeta by ~ T log log T); only the broader W-corrected
      class stays open (open Hilbert-Polya frontier, not a theorem).

  - id: SEELEY-DEWITT-EXPANSION
    statement: >
      The heat trace of H in C_ell (classical elliptic; differential or Laplace-type
      sub-cases) has a polyhomogeneous expansion with no LEADING log term.
    source: >
      For Laplace-type: Berline-Getzler-Vergne Thm 2.30. For differential operators:
      Gilkey Lemma 1.8.2 (NOT "Thm 1.8.1"). For general classical elliptic PsiDO the
      correct reference is Lesch 1999 Thm 3.7 (see LOG-POLYHOMOGENEOUS-HEAT-KERNEL);
      BGV/Gilkey do NOT cover the general PsiDO case (PROMPT_LINT L17).
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    role: >
      Comparison reference: C_ell (subset of C_logpoly with tau_k=0) has pure-power
      leading term. Scope corrected: BGV/Gilkey are differential/Laplace-type only.

