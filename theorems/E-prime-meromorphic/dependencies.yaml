  - id: MARTY-NORMAL-FAMILIES-MEROMORPHIC
    statement: >
      A family F of meromorphic functions on an open set U is normal (precompact in the
      topology of locally uniform convergence on the Riemann sphere) if and only if the
      spherical derivatives f^#(z) = |f'(z)| / (1 + |f(z)|^2) are locally uniformly
      bounded on U.
    source: >
      Marty (1931) C. R. Acad. Sci. Paris 193:761-763.
      Modern reference: Conway 'Functions of One Complex Variable' Vol. II §XV.2.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    gate_a_note: "Citation by theorem number not verified; standard result."
    role: >
      Context only -- NOT load-bearing. OB-11 established that on the holomorphy domain
      Omega, hypothesis (LB) gives local uniform boundedness on an open neighborhood of
      each compact, so **Montel suffices (Conway VII.2.9); Marty is NOT needed**. Kept
      here only to record that the spherical/Marty route was considered and found
      unnecessary. The genuine simple pole at each p in the polar set is recovered by a
      contour/residue argument on 1/F_{n_j} (E'-pos proof step 3), not by Marty normality.

