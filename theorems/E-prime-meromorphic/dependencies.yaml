# Dependencies — Theorem E' (E-prime-meromorphic)

theorem_id: E-prime-meromorphic
status: PROOF-DRAFT (E'-neg); OPEN (E'-pos)

dependencies:

  - id: WEIERSTRASS-PRODUCT-ORDER-1
    statement: >
      A meromorphic function of order at most 1 with prescribed zeros {z_j} and poles
      {p_k} (both sequences with |z_j|, |p_k| -> inf and no accumulation point in C)
      can be written as F(z) = exp(az+b) * prod_j E_1(z/z_j) / prod_k E_1(z/p_k)
      where E_1(u) = (1-u)*exp(u) is the Weierstrass elementary factor of genus 1.
      The factorization is unique up to the choice of a, b in C.
    source: >
      Titchmarsh 'Theory of Functions' §8.7; Ahlfors 'Complex Analysis' §5.2.
      Classical Weierstrass/Mittag-Leffler product theory.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    gate_a_note: >
      Theorem numbers from Titchmarsh/Ahlfors not yet verified against physical copies.
      The result is completely standard; gate A open only on citation formality.
    role: >
      Lemma E'.1: meromorphic Hadamard uniqueness. Same zeros, poles, and one value
      at a non-pole point uniquely determine a meromorphic function of order 1.

  - id: HADAMARD-PRODUCT-XI
    statement: >
      Xi(z) = Xi(0) * prod_n (1 - z^2/gamma_n^2); product absolutely convergent; order 1.
    source: "Titchmarsh 'Theory of the Riemann Zeta Function' §2.12."
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: CLEAR
    role: >
      |W(iR)| -> infty computation; same Hadamard lower bound as E-neg §3.

  - id: SUZUKI-COR6
    statement: >
      (Suzuki arXiv:2606.09096, Corollary 6) RH follows if
      e^{phi(a,z)} W(a,theta;z) -> z^2 xi(1/2-iz)/xi'(1/2-iz) uniformly on compacts.
      The target W is meromorphic with poles at Riemann zero ordinates.
    source: "arXiv:2606.09096, Cor 6; source-checked, baseline/suzuki-2606.09096/."
    mathematical: INDEPENDENTLY-CHECKED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: false
    gate_a_status: CLEAR
    role: >
      Establishes the Suzuki track as the correct setting for E'-pos;
      the meromorphic target W is precisely defined there.

  - id: MARTY-NORMAL-FAMILIES-MEROMORPHIC
    statement: >
      A family F of meromorphic functions on an open set U is normal (precompact in the
      topology of locally uniform convergence on the Riemann sphere) if and only if the
      spherical derivatives f^#(z) = |f'(z)| / (1 + |f(z)|^2) are locally uniformly
      bounded on U.
    source: >
      Marty (1931) C. R. Acad. Sci. Paris 193:761-763.
      Modern reference: Conway 'Functions of One Complex Variable' Vol. II §XV.2.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    gate_a_note: "Citation by theorem number not verified; standard result."
    role: >
      E'-pos: normal family theorem for meromorphic setting (replaces Montel in E-pos).

