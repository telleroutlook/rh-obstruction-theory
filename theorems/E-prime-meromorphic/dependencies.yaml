# Dependencies — Theorem E' (E-prime-meromorphic)

theorem_id: E-prime-meromorphic
status: PROOF-DRAFT — Gate-A BLOCKED (OB-30 2026-08-12) for the Suzuki-target claim (degree z^{2J+3} wrong; (A2) false for real B=iA'; Suzuki entire, PL+ incompatible). Survives as an abstract odd-meromorphic lemma only.

dependencies:

  - id: WEIERSTRASS-PRODUCT-ORDER-1
    statement: >
      A meromorphic function of order at most 1 with prescribed zeros {z_j} and poles
      {p_k} (both sequences with |z_j|, |p_k| -> inf and no accumulation point in C)
      can be written as F(z) = exp(az+b) * prod_j E_1(z/z_j) / prod_k E_1(z/p_k)
      where E_1(u) = (1-u)*exp(u) is the Weierstrass elementary factor of genus 1.
      The factorization is unique up to the choice of a, b in C.
    source: >
      Titchmarsh 'Theory of Functions' §8.7; Ahlfors 'Complex Analysis' §5.2.
      Classical Weierstrass/Mittag-Leffler product theory.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    peer_reviewed: true
    gate_a_status: OPEN
    gate_a_note: >
      Theorem numbers from Titchmarsh/Ahlfors not yet verified against physical copies.
      The result is completely standard; gate A open only on citation formality.
    role: >
      Lemma E'.1: meromorphic Hadamard uniqueness. Same zeros, poles, and one value
      at a non-pole point uniquely determine a meromorphic function of order 1.

