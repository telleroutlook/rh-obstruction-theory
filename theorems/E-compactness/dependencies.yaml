      record does not identify Xi within its fiber (per-N non-identifiability).
    source: "proof.md §3 (fixed-N IFT via log-power-sum system Phi_r; exact Vandermonde Jacobian; Cauchy-coefficient separation)"
    mathematical: PROOF-DRAFT
    computational: NONE
    usable_as_premise: true
    gate_a_status: CONFIRMED-OB03
