  # ---- Classical complex analysis (standard, no need for new source check) ----

  - id: MONTEL-VITALI
    statement: >
      Montel's theorem: a locally uniformly bounded family of holomorphic
      functions on a domain in C is a normal family (every sequence has a
      locally uniformly convergent subsequence). Vitali's theorem: if a
      normal family has a subsequence converging on a set with an accumulation
      point, it converges locally uniformly.
    source: "Standard: Ahlfors Complex Analysis §5.5; Conway Functions of One Complex Variable §VII.2"
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Used in Theorem E-pos: (H-bound) gives normal family; Vitali identifies the limit."

  - id: HURWITZ-THEOREM
    statement: >
      Hurwitz's theorem: if f_N -> f locally uniformly with f not identically
      zero, then every zero of f is the limit of zeros of f_N.
    source: "Standard: Ahlfors §5.1; Conway §VII.2.5"
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Transfers real-zero location to the limit in Theorem E-pos (entire target). NOT applicable to the Suzuki meromorphic target."

  - id: HADAMARD-FACTORIZATION
    statement: >
      An entire function of finite order rho has a Hadamard factorization
      with canonical product over its zeros; for order-one entire functions
      the product converges absolutely given sum 1/|z_n| < infty (or the
      genus-1 product with convergence exponent bound).
    source: "Standard: Levin 'Distribution of Zeros of Entire Functions' Ch. I-II; Ahlfors §5.3"
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Used in E-neg counterexample construction and E-pos tail-control argument."

