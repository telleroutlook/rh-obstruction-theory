# Dependencies — Theorem D (D-spectral-asymptotic)

theorem_id: D-spectral-asymptotic
status: PROOF-DRAFT (novelty gate CLEARED; ready for independent review)

dependencies:

  - id: WEYL-LAW-CLASSICAL
    statement: >
      For H a positive elliptic pseudodifferential operator of order m > 0 on a
      compact d-dimensional smooth manifold (with or without boundary, standard
      elliptic BCs), N_H(T) ~ C_H T^{d/m} as T -> infinity, C_H > 0 is the
      Weyl constant determined by the principal symbol.
    source: >
      Hormander (1968) Acta Math. 121; Seeley (1969); Ivrii (1980).
      Standard: see also Shubin 'Pseudodifferential Operators and Spectral Theory' Ch. 4.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Main Weyl law; used in Theorem D §1 contradiction."

  - id: RIEMANN-VON-MANGOLDT
    statement: >
      N_zeta(T) = T/(2pi) log(T/2pi) - T/(2pi) + O(log T).
    source: "Standard: Titchmarsh 'Theory of the Riemann Zeta Function' §9.4; Davenport 'Multiplicative Number Theory' Ch. 15."
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "The T log T counting law; used in heat-trace Abel-Plana computation (proof.md §4)."

  - id: SEELEY-DEWITT-EXPANSION
    statement: >
      LEADING heat-trace singularity of a positive classical ELLIPTIC pseudodifferential
      H of order m>0 on a closed d-manifold is a PURE POWER: Z_H(t) = a_0 t^{-d/m} +
      O(t^{-d/m+eps}), a_0>0, with NO t^{-d/m} log(1/t) leading term. (Subleading
      t^k log t terms, k>=1, CAN occur when Wres(H^k) != 0 — the earlier 'no log at any
      order' claim was REFUTED, OB-01/OB-15; only the leading term is log-free, which is
      all Theorem D needs.)
    source: >
      General classical elliptic PsiDO (load-bearing): Lesch (1999),
      'On the noncommutative residue for pseudodifferential operators with
      log-polyhomogeneous symbols', Ann. Global Anal. Geom. 17, 151-187, Theorem 3.7 +
      eqs (3.18)-(3.22) with A=I; extends Grubb-Seeley (1995) Invent. Math. 121, Thm 2.7.
      Complex powers: Seeley (1967) AMS Proc. Symp. Pure Math. 10, 288-307.
      SCOPE-LIMITED references (do NOT cover general PsiDO): Berline-Getzler-Vergne (1992)
      Thm 2.30 (Laplace-type / order-2 differential only); Gilkey 'Invariance Theory...'
      2nd ed. 1995, Lemma 1.8.2 (NOT 'Thm 1.8.1'; differential operators only).
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: >
      Key: no t^{-d/m} log(1/t) LEADING term for H in C_ell, while Z_zeta has
      (1/2pi) log(1/t)/t leading. Citation pinned by OB-15 to Lesch 1999 Thm 3.7
      (general classical elliptic PsiDO); BGV Thm 2.30 and Gilkey Lemma 1.8.2 are
      differential/Laplace-type only and are NOT the load-bearing citation (PROMPT_LINT L17).

  - id: COURANT-WEYL-PERTURBATION
    statement: >
      If V is H-compact and preserves the leading Weyl constant, then
      N_{H+V}(T) = N_H(T) + O(T^{(d-1)/m}).
    source: "Courant-Hilbert 'Methods of Mathematical Physics' Vol. 1; Reed-Simon Vol. 4 XIII.15."
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Extension to perturbations preserving the leading Weyl law (Theorem D')."

  - id: ENDRES-STEINER-NO-GO
    statement: >
      No compact quantum graph Hamiltonian with local energy-independent vertex
      conditions has spectrum {gamma_n} (the imaginary parts of Riemann zeros).
    source: "Endres-Steiner, J. Phys. A 43 (2010) 095204. doi:10.1088/1751-8113/43/9/095204"
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: >
      Prior art (closest existing no-go). Theorem D goes beyond this: full C_ell class
      (not just compact quantum graphs) and heat-trace singularity type (not just Weyl
      leading term). Novelty gate CLEARED — see novelty.md.

