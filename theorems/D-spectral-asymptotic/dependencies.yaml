# Dependencies — Theorem D (D-spectral-asymptotic)

theorem_id: D-spectral-asymptotic
status: PROOF-DRAFT (Gate-A CONDITIONAL->PASS after OB-25 mods; positioned as scope-extension/corollary)

dependencies:

  - id: WEYL-LAW-CLASSICAL
    statement: >
      For H a positive self-adjoint classical elliptic pseudodifferential operator of
      order m > 0 on a CLOSED d-dimensional smooth manifold, N_H(T) ~ C_H T^{d/m} as
      T -> infinity, C_H > 0 the Weyl constant determined by the principal symbol.
    source: >
      Hormander (1968) Acta Math. 121, Theorem 4.4 (local spectral function of an
      order-one scalar elliptic PsiDO on a closed manifold), applied to the order-one
      operator H^{1/m} obtained from Seeley's complex-power calculus (Seeley 1967,
      'Complex powers of an elliptic operator', Proc. Sympos. Pure Math. 10, AMS,
      pp. 288-307), using N_{H^{1/m}}(lambda) = N_H(lambda^m). Textbook: Shubin
      'Pseudodifferential Operators and Spectral Theory' Ch. 4. (Boundary-value /
      two-term refinements are NOT used by D, which lives on a closed manifold; the
      earlier unspecified 'Seeley 1969 / Ivrii 1980' entries are removed.)
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Main Weyl law; used in Theorem D §1 contradiction."

  - id: RIEMANN-VON-MANGOLDT
    statement: >
      N_zeta(T) = T/(2pi) log(T/2pi) - T/(2pi) + O(log T).
    source: "Standard: Titchmarsh 'Theory of the Riemann Zeta Function' §9.4; Davenport 'Multiplicative Number Theory' Ch. 15."
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "The T log T counting law; used in heat-trace Abel-Plana computation (proof.md §4)."

  - id: SEELEY-DEWITT-EXPANSION
    statement: >
      LEADING heat-trace singularity of a positive classical ELLIPTIC pseudodifferential
      H of order m>0 on a closed d-manifold is a PURE POWER: Z_H(t) = a_0 t^{-d/m} +
      O(t^{-d/m+eps}), a_0>0, with NO t^{-d/m} log(1/t) leading term. (Subleading
      t^k log t terms, k>=1, CAN occur when Wres(H^k) != 0 — the earlier 'no log at any
      order' claim was REFUTED, OB-01/OB-15; only the leading term is log-free, which is
      all Theorem D needs.)
    source: >
      General classical elliptic PsiDO (load-bearing): Lesch (1999),
      'On the noncommutative residue for pseudodifferential operators with
      log-polyhomogeneous symbols', Ann. Global Anal. Geom. 17, 151-187. SOURCE-VERIFIED
      in-repo against arXiv dg-ga/9708010 v4 (baseline/lesch-dg-ga-9708010/): the
      load-bearing result is Theorem 3.7 (version-independent anchor; preprint label
      S1-3.5). The heat expansion Tr(A e^{-tP}) ~ sum_j t^{(j-n-a)/m} c_j(log t) +
      sum_j d_j t^j is published eq. (3.18) (= preprint (3.9), label G1-3.9); the degree
      bound deg c_j <= k if (j-a-n)/m not in Z+, else k+1, is published eq. (3.19); the
      Mellin/pole statement is published eq. (3.20) (= preprint (3.10)). Cite Theorem 3.7
      + (3.18)/(3.19)/(3.20); a bare '(3.9)' denotes a DIFFERENT equation in the published
      version (preprint-vs-published renumbering, see PROVENANCE.md). With A=I (a=0,k=0),
      j=0: exponent -n/m<0 not in Z+, so c_0 is constant => leading term t^{-n/m} carries
      NO log.
      Proof follows Grubb-Seeley (1995) Invent. Math. 121, Thm 2.7 (cited in the proof).
      SCOPE-LIMITED references (do NOT cover general PsiDO): Berline-Getzler-Vergne (1992)
      Thm 2.30 (Laplace-type / order-2 differential only); Gilkey 'Invariance Theory...'
      2nd ed. 1995, Lemma 1.8.2 (NOT 'Thm 1.8.1'; differential operators only).
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: >
      Key: no t^{-d/m} log(1/t) LEADING term for H in C_ell, while Z_zeta has
      (1/2pi) log(1/t)/t leading. Citation pinned by OB-15 to Lesch 1999 Thm 3.7
      (general classical elliptic PsiDO); BGV Thm 2.30 and Gilkey Lemma 1.8.2 are
      differential/Laplace-type only and are NOT the load-bearing citation (PROMPT_LINT L17).

  - id: COURANT-WEYL-PERTURBATION
    statement: >
      If V is H-compact and preserves the leading Weyl constant, then
      N_{H+V}(T) = N_H(T) + O(T^{(d-1)/m}).
    source: "Courant-Hilbert 'Methods of Mathematical Physics' Vol. 1; Reed-Simon Vol. 4 XIII.15."
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: "Extension to perturbations preserving the leading Weyl law (Theorem D')."

  - id: ENDRES-STEINER-NO-GO
    statement: >
      No compact quantum graph Hamiltonian with local energy-independent vertex
      conditions has spectrum {gamma_n} (the imaginary parts of Riemann zeros).
    source: "Endres-Steiner, J. Phys. A 43 (2010) 095204. doi:10.1088/1751-8113/43/9/095204"
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: >
      Prior art (closest existing no-go). Endres-Steiner covers only the two Berry-Keating
      families H_BK, H_BK^2 on compact metric graphs (Thms 15.4-15.6), NOT all compact
      quantum-graph operators, and graphs are not closed smooth manifolds. Theorem D's
      identifiable increment: full C_ell (classical elliptic PsiDO on a closed manifold)
      + leading-vs-subleading log distinction. D is positioned as a SCOPE-EXTENSION/
      COROLLARY, not standalone novelty (OB-25 Q5; see novelty.md).

  - id: WATSON-VALENTINUZZI-PRECEDENT
    statement: >
      Any self-adjoint operator with superlinear eigenvalue counting N(lambda) ~
      lambda*L(lambda) (L slowly varying) satisfies heat trace Theta(t) ~ t^{-1} L(1/t)
      by Tauberian analysis; a fourth-order single-valuation kernel limit has Theta(t) ~
      t^{-1/4}. The incompatible spectral dimensions give a structural obstruction. States
      a closely related leading-log obstruction for elliptic DIFFERENTIAL operators on
      compact manifolds.
    source: >
      Douglas F. Watson and Tiziano Valentinuzzi, 'Spectral-Dimension Obstructions for
      Operators with Superlinear Counting Laws', Bull. Sci. Math. 211 (2026), 103824,
      doi:10.1016/j.bulsci.2026.103824; arXiv:2604.00052 (Theorem 1.4, Prop 6.2, Thm 7.2).
      Existence + title + DOI + authors verified 2026-08-11 (arXiv metadata).
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: false
    role: >
      NEAR-DIRECT PRECEDENT that MUST be disclosed (OB-25 Q5). NOT imported as a premise:
      the accessible arXiv v1 uses two-sided |gamma|<=T counting with the one-sided 1/(2pi)
      coefficient (a factor-2 mismatch) and RH-style '1/2+i*gamma_n runs over the nontrivial
      zeros' phrasing in Sec 7.2, so it cannot be pasted in as a clean RH-free proof. Its
      existence establishes that a leading-log obstruction for (differential) elliptic
      operators is already in the literature; D's contribution is the PsiDO-class extension.

