  - id: CHEBYSHEV-INTEGRAL-COEFFICIENTS-AND-LEADING-TERM
    statement: >
      T_j(z) has integer coefficients and leading coefficient 2^(j-1) for j>=1.
    source: >
      Standard recurrence T_0=1, T_1=z, T_{j+1}=2zT_j-T_{j-1}; proved directly
      in proof.md. No external premise is needed.
    mathematical: REFEREED
