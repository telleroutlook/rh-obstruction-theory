  - id: INERT-PRIME-RESIDUE-FIELD
    statement: >
      If p=3 mod 4, then -1 is not a square mod p and the residue field of
      Z[i] at p is F_{p^2}.
    source: >
      Standard quadratic-reciprocity / inert-prime fact; the needed -1
      nonsquare part follows from Euler's criterion (-1)^((p-1)/2)=-1.
    mathematical: REFEREED
    computational: NONE
    usable_as_premise: true
    role: Establishes on-line p-integrality and the finite residue field.
